name = "cronica"
main = "src/worker.ts"
compatibility_date = "2026-08-26"
workers_dev = false
preview_urls = false

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Ensure Worker can set AASA Content-Type instead of raw asset serving.
run_worker_first = ["/.well-known/*", "/apple-app-site-association"]
