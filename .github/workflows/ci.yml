name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Icon Composer (.icon) needs Xcode 26.6; macos-15 only ships ≤26.3 whose actool crashes on .icon.
    runs-on: macos-26
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          if [ ! -d "/Applications/Xcode_26.6.app" ]; then
            echo "Xcode 26.6 is required to compile AppIcon.icon"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      # Xcode 26.6 may advertise OS=latest as 26.6 even when that simulator runtime isn't installed.
      - name: Resolve simulator destinations
        id: sims
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys

          runtimes = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"], text=True)
          )["runtimes"]

          def newest(prefix: str) -> str:
              versions = [
                  tuple(int(part) for part in runtime["version"].split("."))
                  for runtime in runtimes
                  if runtime.get("isAvailable") and runtime["name"].startswith(prefix)
              ]
              if not versions:
                  raise SystemExit(f"No available {prefix} simulator runtimes")
              return ".".join(str(part) for part in max(versions))

          ios = newest("iOS ")
          watch = newest("watchOS ")
          print(f"Resolved destinations → iOS {ios}, watchOS {watch}", file=sys.stderr)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ios=platform=iOS Simulator,name=iPhone 17,OS={ios}\n")
              output.write(
                  f"watch=platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS={watch}\n"
              )
          PY

      # Cancelled/reused runners leave partial Sentry XCFramework downloads that make
      # SwiftPM fail with "already exists in file system".
      - name: Clear stale SwiftPM binary artifacts
        run: rm -rf "${HOME}/Library/Caches/org.swift.swiftpm/artifacts"

      - name: Prepare secrets config
        run: |
          cp Config/Secrets.xcconfig.example Config/Secrets.xcconfig
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i '' "s/YOUR_TMDB_API_KEY/$TMDB_API_KEY/" Config/Secrets.xcconfig
          fi

      - name: Build CronicaCore package
        run: swift test --package-path Packages/CronicaCore

      - name: Resolve Xcode package dependencies
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Cronica.xcodeproj \
            -scheme "Cronica (EN-US)"

      - name: Build Cronica (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cronica.xcodeproj \
            -scheme "Cronica (EN-US)" \
            -destination '${{ steps.sims.outputs.ios }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Test Cronica
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cronica.xcodeproj \
            -scheme "Cronica (EN-US)" \
            -destination '${{ steps.sims.outputs.ios }}' \
            -configuration Debug \
            -only-testing:'Cronica Tests' \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/CronicaTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Cronica Widget Extension
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cronica.xcodeproj \
            -scheme CronicaWidgetExtension \
            -destination '${{ steps.sims.outputs.ios }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Cronica Share Extension
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cronica.xcodeproj \
            -scheme CronicaShareExtension \
            -destination '${{ steps.sims.outputs.ios }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Cronica (macOS)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cronica.xcodeproj \
            -scheme "Cronica (EN-US)" \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Cronica Watch App
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cronica.xcodeproj \
            -scheme "Cronica Watch App" \
            -destination '${{ steps.sims.outputs.watch }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test
